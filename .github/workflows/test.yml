name: Tests

on:
  push:
    branches:
      - master
      - "feature/**"
      - "fix/**"
      - "ci/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # pandoc for the DokuWiki migration tests (test/wiki.migration.test.js
      # skips them without it); same version as in docs/wiki.md
      - name: Install pandoc
        run: |
          curl -sSLf -o "$RUNNER_TEMP/pandoc.deb" https://github.com/jgm/pandoc/releases/download/3.14/pandoc-3.14-1-amd64.deb
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -1
      # Chrome + chromedriver are preinstalled on ubuntu-latest (Selenium UI tests).
      # The first Chrome start on a fresh runner is slow; doing it here keeps
      # it out of the first UI test's 30 s hook timeout and logs both times.
      - name: Warm up Chrome
        run: NODE_ENV=test TEST_HEADLESS=TRUE node tools/warm-up-browser.mjs
      # same tests as `npm test`, measured with c8 (V8 coverage, works with ESM)
      - run: npm run test:coverage
      # coverage per directory against coverage-thresholds.json, table in the job summary
      - run: npm run coverage:check
      - name: Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload test diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-actual-files
          path: |
            test/**/*_actual.*
          if-no-files-found: ignore

  # Builds the container image (Containerfile) so a broken build or
  # `npm ci --omit=dev` shows up before a release; then starts it against
  # PostgreSQL and expects the login page. Nothing is pushed.
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f Containerfile -t osmbc:ci .
      - name: No config files in the image
        run: |
          found=$(docker run --rm osmbc:ci sh -c 'ls /app/config.*.yaml /app/config.*.yml /app/config.*.json 2>/dev/null' || true)
          if [ -n "$found" ]; then echo "config files in image: $found"; exit 1; fi
      - name: Start against PostgreSQL
        run: |
          docker network create osmbc
          docker run -d --name osmbc-db --network osmbc -e POSTGRES_USER=osmbc -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=osmbc postgres:18
          until docker exec osmbc-db pg_isready -U osmbc -d osmbc; do sleep 1; done
          mkdir -p "$RUNNER_TEMP/config" "$RUNNER_TEMP/data"
          chmod 777 "$RUNNER_TEMP/data"
          # runs inside the image (js-yaml is there); the test config is not
          docker run --rm -v "$PWD/config.test.yaml:/tmp/config.test.yaml:ro" -v "$RUNNER_TEMP/config:/out" -u "$(id -u)" osmbc:ci \
            node tools/container-test-config.mjs /tmp/config.test.yaml /out/config.production.yaml
          docker run --rm --network osmbc -e POSTGRES_PASSWORD=ci -v "$RUNNER_TEMP/config:/config:ro" osmbc:ci \
            node import/createdb.js --createTables --createIndex --addUser CIUser
          docker run -d --name osmbc --network osmbc -p 127.0.0.1:3000:3000 -e POSTGRES_PASSWORD=ci \
            -v "$RUNNER_TEMP/config:/config:ro" -v "$RUNNER_TEMP/data:/data" osmbc:ci
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          docker stop osmbc
          docker logs osmbc
          [ "$code" = 200 ] || { echo "login page answered $code"; exit 1; }
          docker logs osmbc 2>&1 | grep -q "Received a stoprequest (SIGTERM)"
