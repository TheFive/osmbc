# Default help menu, copied into the database on the first start; change
# it later in Admin -> Configure Help Menu.
# Entries: [label, url], [label, header] or "---" (divider).
# "~/path" is a path inside this OSMBC, e.g. ~/wiki for the built-in wiki
# (shown only when the wiki is switched on and the user may read it).

- [OSMBC, header]
- [Changelog, https://github.com/TheFive/osmbc/blob/master/CHANGELOG.md]
- [Wiki, ~/wiki]
